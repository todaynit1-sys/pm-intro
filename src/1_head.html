<style>

/* 단추 · 판 · 꼬리표 */

/* 본부 화면 */

.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*9)}

.field{display:flex;align-items:center;gap:calc(var(--u)*8);font-family:var(--disp);font-size:calc(var(--u)*15)}
.field input{flex:1;min-width:0;padding:calc(var(--u)*7) calc(var(--u)*11);border:calc(var(--u)*2.5) solid var(--ink);border-radius:calc(var(--u)*11);background:#fff;font-family:var(--body);font-weight:700;font-size:calc(var(--u)*15);-webkit-user-select:text;user-select:text}

/* 제목 */

.logo{text-align:center;color:#fff}

/* 수첩 */

/* 움직이는 글자 · 화면 넘김 · 알림 */

@keyframes kin{0%{opacity:0;transform:scale(2.8) rotate(-10deg)}12%{opacity:1;transform:scale(.94) rotate(-3deg)}19%{transform:scale(1.06) rotate(-3deg)}26%,82%{opacity:1;transform:scale(1) rotate(-3deg)}100%{opacity:0;transform:scale(.9) translateY(-40%) rotate(-3deg)}}

@keyframes wOut{to{transform:translateX(115%) skewX(-18deg)}}
